<body>
<script>MazeGuard.enter(3);</script>
<h2>请输入第 3 层密码：</h2>
<input type="password" id="pwd" autocomplete="off">
<button onclick="nextPwd()">进入下一步</button>
<p id="msg"></p>
<script>
async function nextPwd() {
  await MazeGuard.submit(3, document.getElementById("pwd").value);
}
</script>

<h3>字符串 bx 的 SHA-256 十六进制摘要的前 8 位（小写）</h3>
